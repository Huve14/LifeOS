<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="mtile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34827D"/>
      <stop offset="55%" stop-color="#256460"/>
      <stop offset="100%" stop-color="#1A4B48"/>
    </linearGradient>
    <radialGradient id="msheen" cx="30%" cy="24%" r="64%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mess" x1="0.30" y1="0" x2="0.62" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F3D389"/>
      <stop offset="45%" stop-color="#E6B45E"/>
      <stop offset="100%" stop-color="#C4714A"/>
    </linearGradient>
    <filter id="msoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0C2A28" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- full-bleed opaque background (OS applies the mask) -->
  <rect width="200" height="200" fill="url(#mtile)"/>
  <rect width="200" height="200" fill="url(#msheen)"/>

  <!-- content scaled into the maskable safe zone -->
  <g transform="translate(20,20) scale(0.8)">
    <g transform="translate(6,5) scale(0.94)">
      <path d="M133 57 A32 32 0 1 0 100 100 A32 32 0 1 1 67 143"
            fill="none" stroke="url(#mess)" stroke-width="29" stroke-linecap="round" filter="url(#msoft)"/>
      <path d="M151 39 C151 46.5 154 49.5 161.5 49.5 C154 49.5 151 52.5 151 60 C151 52.5 148 49.5 140.5 49.5 C148 49.5 151 46.5 151 39 Z"
            fill="#F6DA93"/>
    </g>
  </g>
</svg>
