<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#81CEEB"/>
      <stop offset="55%" stop-color="#5AB8DA"/>
      <stop offset="100%" stop-color="#17627E"/>
    </linearGradient>
    <radialGradient id="sheen" cx="28%" cy="22%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ess" x1="0.30" y1="0" x2="0.62" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFF9C7"/>
      <stop offset="45%" stop-color="#F6D110"/>
      <stop offset="100%" stop-color="#FFE86D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17627E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="200" height="200" rx="46" fill="url(#tile)"/>
  <rect width="200" height="200" rx="46" fill="url(#sheen)"/>

  <g transform="translate(6,5) scale(0.94)">
    <!-- the journey S -->
    <path d="M133 57 A32 32 0 1 0 100 100 A32 32 0 1 1 67 143"
          fill="none" stroke="url(#ess)" stroke-width="29" stroke-linecap="round" filter="url(#soft)"/>
    <!-- guiding star at the journey's beginning -->
    <path d="M151 39 C151 46.5 154 49.5 161.5 49.5 C154 49.5 151 52.5 151 60 C151 52.5 148 49.5 140.5 49.5 C148 49.5 151 46.5 151 39 Z"
          fill="#FFF9C7"/>
  </g>
</svg>
